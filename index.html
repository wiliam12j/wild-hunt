<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wild Hunt</title>
    <style>
      :root {
        --bg: #12160f;
        --panel: #1d1a13;
        --edge: #8a6a3a;
        --text: #f3e6c4;
        --muted: #b9a57c;
        --accent: #c79a4a;
        --accent-strong: #e0b23a;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Georgia, 'Times New Roman', serif; }
      body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
      #stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
      #stage canvas { display: block; position: absolute; inset: 0; }
      #hud {
        display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 20px;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        background: var(--panel); border-top: 2px solid var(--edge);
      }
      .hud-stat { display: flex; flex-direction: column; align-items: center; min-width: 88px; }
      .hud-stat span { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
      .hud-stat strong { font-size: 20px; font-variant-numeric: tabular-nums; }
      .hud-bet { display: flex; align-items: center; gap: 8px; }
      #hud button {
        font: inherit; color: var(--text); background: #2b2116; border: 2px solid var(--edge);
        border-radius: 10px; cursor: pointer; touch-action: manipulation;
      }
      #hud button:disabled { opacity: 0.4; cursor: default; }
      .hud-bet button { width: 44px; height: 44px; font-size: 24px; }
      #hud .hud-spin {
        min-width: 120px; height: 56px; font-size: 22px; font-weight: bold; letter-spacing: 0.1em;
        background: var(--accent); color: #1b140a; border-color: var(--accent-strong);
      }
      .hud-toggle { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; }
      #hud .hud-small { font-size: 13px; padding: 8px 12px; }
      #hud { position: relative; }
      .hud-bet-value { background: none !important; border-color: transparent !important; padding: 2px 6px; }
      .hud-bet-value:not(:disabled):hover { border-color: var(--edge) !important; }
      #hud .hud-auto { height: 44px; padding: 0 14px; font-size: 15px; letter-spacing: 0.06em; }
      #hud .hud-auto.is-running { background: #5a2a1c; border-color: #c46a4a; }
      .hud-note { flex-basis: 100%; margin: 0; min-height: 0; text-align: center; font-size: 13px; color: var(--muted); }
      .hud-note:empty { display: none; }
      .hud-pop {
        position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); z-index: 10;
        width: min(340px, calc(100vw - 32px)); box-sizing: border-box; padding: 16px;
        background: var(--panel); border: 2px solid var(--edge); border-radius: 14px;
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.6); display: flex; flex-direction: column; gap: 12px;
      }
      .hud-pop[hidden] { display: none; }
      .hud-pop h2 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); text-align: center; }
      .hud-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      #hud .hud-grid button { height: 44px; font-size: 16px; }
      #hud .hud-grid button.is-active { background: var(--accent); color: #1b140a; border-color: var(--accent-strong); }
      #hud .hud-start { height: 48px; font-size: 18px; font-weight: bold; background: var(--accent); color: #1b140a; border-color: var(--accent-strong); }
      @media (max-width: 520px) {
        #hud { gap: 8px 12px; }
        .hud-stat { min-width: 72px; }
        .hud-stat strong { font-size: 17px; }
        #hud .hud-spin { order: -1; flex-basis: 100%; }
      }
    </style>
  </head>
  <body>
    <main id="stage" aria-label="Reels"></main>
    <footer id="hud"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
